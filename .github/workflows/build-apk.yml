name: Build Kodi Watch8 All Sources Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: sdkmanager --version
      - name: Unpack one-upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Kodi-Watch8-AllSources-Remote-V1-OneUpload.zip"
          test -f "$ZIP" || { echo "::error::Upload $ZIP into the repository root"; exit 1; }
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/watch8"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/watch8"
          SETTINGS=$(find "$RUNNER_TEMP/watch8" -type f -name settings.gradle -print -quit)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - name: Test round geometry
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$RUNNER_TEMP/geometry-test"
          javac -d "$RUNNER_TEMP/geometry-test" app/src/main/java/com/kodiwatch/remote/RoundPanelGeometry.java tests/GeometryTest.java
          java -cp "$RUNNER_TEMP/geometry-test" com.kodiwatch.remote.GeometryTest
      - name: Build Wear OS APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/kodi-watch8-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Watch8-AllSources-Remote-APK
          path: kodi-watch8-debug.apk
          if-no-files-found: error
